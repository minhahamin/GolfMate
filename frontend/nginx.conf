server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router의 클라이언트 사이드 라우팅을 지원하려면
    # 존재하지 않는 경로도 전부 index.html로 넘겨야 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html은 절대 캐시하지 않는다 — 캐시되면 배포해도 사용자가 계속
    # 예전 JS 번들 해시를 참조하는 옛 페이지를 보게 된다.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # /assets/의 파일명은 Vite가 내용 해시를 붙이므로, 파일명이 같으면 내용도 같다.
    # 그래서 영구 캐시해도 안전하다 (내용이 바뀌면 새 URL로 나온다).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
