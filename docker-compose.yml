services:
  db:
    # postgres:16-alpine의 pgvector 지원 드롭인 이미지 (Phase 5 RAG용 vector 확장 포함)
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golfmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golfmate}
      POSTGRES_DB: ${POSTGRES_DB:-golfmate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - golfmate_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-golfmate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-golfmate}:${POSTGRES_PASSWORD:-golfmate}@db:5432/${POSTGRES_DB:-golfmate}
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-5180}:5180"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  golfmate_pg_data:
